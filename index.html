<html>
<body onload="pageLoaded()">
<form onsubmit="return validateForm()">

    <!-- Name -->
    Username:<input type="text" id="name" placeholder="Enter Name"
        onfocus="focusField(this)"
        onblur="blurField(this)"
        onkeyup="showLength(this)">
    <span id="msg"></span>
    <br><br>

    <!-- Age -->
    Age: <input type="text" id="age" placeholder="Enter Age"
        onkeypress="allowOnlyNumbers(event)"
        onkeyup="liveAgeCheck(this)">
    <br><br>

    <!-- Country -->
    Country: <select id="country" onchange="countryChanged(this)">
        <option value="">Select Country</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
    </select>
    <br><br>

    <!-- Button -->
    <button type="submit" onclick="buttonClick()">
        Submit
    </button>

</form>
</body>
</html>
